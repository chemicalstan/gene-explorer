[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = true

# Presentation lives here rather than in CSS overrides of Streamlit internals,
# which break whenever Streamlit changes its markup.
[theme]
base = "light"
primaryColor = "#b8603c"
backgroundColor = "#f6efe9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f1c1a"
