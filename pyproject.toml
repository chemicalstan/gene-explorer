[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-explorer"
version = "1.0.0"
description = "Conversational agent for querying cancer gene expression data."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.7",
    "starlette==1.3.1",
    "uvicorn[standard]==0.34.0",
    "openai-agents==0.18.3",
    "openai==2.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "pandas==2.2.3",
    "slowapi==0.1.10",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "pandas-stubs==2.2.3.241126",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gene_explorer = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gene_explorer"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 3.12 matches the checking interpreter and parses numpy's PEP 695 stubs.
# The runtime floor stays 3.11 (requires-python, ruff target-version).
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gene_explorer"]
branch = true
