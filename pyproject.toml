[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-explorer"
version = "1.0.0"
description = "Conversational agent for querying cancer gene expression data."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openai-agents==0.18.3",
    "openai==2.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "pandas-stubs==2.2.3.241126",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gene_explorer = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gene_explorer"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
